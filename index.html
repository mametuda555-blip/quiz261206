<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>二次会クイズ大会</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", sans-serif;
      margin: 0; padding: 16px; background: #f4f6f9; color: #222;
      display: flex; flex-direction: column; align-items: center; min-height: 100vh;
    }
    .card {
      background: #fff; width: 100%; max-width: 480px; border-radius: 16px;
      padding: 24px 20px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); text-align: center;
    }
    h1 { font-size: 1.4rem; color: #1e3a5f; margin-top: 0; }
    .sub { color: #666; font-size: 0.9rem; margin-bottom: 16px; }
    input[type="text"] {
      width: 100%; padding: 14px; font-size: 1.1rem; border: 2px solid #cbd5e1;
      border-radius: 10px; margin-bottom: 16px; text-align: center;
    }
    .btn-primary {
      width: 100%; padding: 14px; font-size: 1.1rem; font-weight: bold;
      background: #1e3a5f; color: #fff; border: none; border-radius: 10px; cursor: pointer;
    }
    .q-text { font-size: 1.8rem; font-weight: bold; color: #1e3a5f; margin: 8px 0 24px; }
    .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .choice-btn {
      width: 100%; padding: 28px 0; font-size: 2.2rem; font-weight: bold;
      background: #f8fafc; color: #1e3a5f; border: 2px solid #cbd5e1;
      border-radius: 14px; cursor: pointer; transition: 0.15s;
    }
    .choice-btn.selected {
      background: #1e3a5f; color: #fff; border-color: #1e3a5f;
    }
    .choice-btn:disabled { opacity: 0.7; cursor: not-allowed; }
    .status-box {
      padding: 20px; border-radius: 12px; background: #f8fafc; margin-top: 12px;
    }
    .correct { background: #dcfce7; color: #166534; font-weight: bold; font-size: 1.4rem; }
    .wrong { background: #fee2e2; color: #991b1b; font-weight: bold; font-size: 1.4rem; }
    .user-bar {
      width: 100%; max-width: 480px; display: flex; justify-content: space-between;
      align-items: center; font-size: 0.85rem; color: #555; margin-bottom: 10px;
    }
    .link-btn { background: none; border: none; color: #1e3a5f; text-decoration: underline; cursor: pointer; font-size: 0.85rem; }
  </style>
</head>
<body>
  <div id="userBar" class="user-bar" style="display:none;">
    <span>参加者：<strong id="displayName"></strong></span>
    <button id="changeNameBtn" class="link-btn">名前を変更</button>
  </div>

  <!-- ニックネーム登録画面 -->
  <div id="joinCard" class="card">
    <h1>二次会クイズ大会</h1>
    <p class="sub">ランキングに表示されるニックネームを入力してください<br>（フルネーム不要）</p>
    <input type="text" id="nameInput" placeholder="例：たろうS" maxlength="15">
    <button id="joinBtn" class="btn-primary">参加する</button>
  </div>

  <!-- クイズ画面 -->
  <div id="gameCard" class="card" style="display:none;">
    <div id="contentArea"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, set, onValue, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
    import { firebaseConfig, QUESTIONS } from "./config.js";

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let userId = localStorage.getItem("quiz_uid");
    if (!userId) {
      userId = "u_" + Math.random().toString(36).substring(2, 10) + Date.now().toString(36);
      localStorage.setItem("quiz_uid", userId);
    }
    let userName = localStorage.getItem("quiz_uname") || "";
    let currentState = { phase: "waiting", questionIndex: 0 };
    let myAnswers = {};

    const joinCard = document.getElementById("joinCard");
    const gameCard = document.getElementById("gameCard");
    const userBar = document.getElementById("userBar");
    const displayName = document.getElementById("displayName");
    const contentArea = document.getElementById("contentArea");

    async function registerUser(name) {
      userName = name.trim();
      if (!userName) return alert("ニックネームを入力してください");
      localStorage.setItem("quiz_uname", userName);
      await set(ref(db, `users/${userId}`), { name: userName, joinedAt: Date.now() });
      showGame();
    }

    function showGame() {
      joinCard.style.display = "none";
      gameCard.style.display = "block";
      userBar.style.display = "flex";
      displayName.textContent = userName;
      render();
    }

    document.getElementById("joinBtn").addEventListener("click", () => {
      registerUser(document.getElementById("nameInput").value);
    });

    document.getElementById("changeNameBtn").addEventListener("click", () => {
      const next = prompt("新しいニックネームを入力してください", userName);
      if (next && next.trim()) registerUser(next);
    });

    if (userName) {
      set(ref(db, `users/${userId}`), { name: userName, joinedAt: Date.now() });
      showGame();
    }

    onValue(ref(db, "state"), (snap) => {
      currentState = snap.val() || { phase: "waiting", questionIndex: 0 };
      render();
    });

    onValue(ref(db, "answers"), (snap) => {
      const all = snap.val() || {};
      myAnswers = {};
      Object.keys(all).forEach((qIdx) => {
        if (all[qIdx] && all[qIdx][userId] !== undefined) {
          myAnswers[qIdx] = all[qIdx][userId];
        }
      });
      render();
    });

    async function selectChoice(qIdx, choiceIdx) {
      if (currentState.phase !== "open") return;
      myAnswers[qIdx] = choiceIdx;
      render();
      try {
        await set(ref(db, `answers/${qIdx}/${userId}`), choiceIdx);
      } catch (e) {
        alert("回答は締め切られました");
      }
    }

    async function render() {
      if (!userName) return;
      const { phase, questionIndex } = currentState;
      const q = QUESTIONS[questionIndex];
      contentArea.innerHTML = "";

      if (phase === "waiting" || !q) {
        contentArea.innerHTML = `
          <h1>まもなくスタート！</h1>
          <p class="sub">スクリーンに注目してお待ちください。</p>
        `;
        return;
      }

      if (phase === "open") {
        const myChoice = myAnswers[questionIndex];

        const qText = document.createElement("div");
        qText.className = "q-text";
        qText.textContent = q.text;

        const list = document.createElement("div");
        list.className = "choices";

        q.choices.forEach((c, idx) => {
          const btn = document.createElement("button");
          btn.className = "choice-btn" + (myChoice === idx ? " selected" : "");
          btn.textContent = c;
          btn.onclick = () => selectChoice(questionIndex, idx);
          list.appendChild(btn);
        });

        const note = document.createElement("p");
        note.className = "sub";
        note.style.marginTop = "20px";
        note.textContent = myChoice !== undefined ? `「${q.choices[myChoice]}」を選択中（締切前なら変更できます）` : "答えの番号をタップしてください";

        contentArea.append(qText, list, note);
        return;
      }

      if (phase === "closed") {
        const myChoice = myAnswers[questionIndex];
        const chosenText = myChoice !== undefined ? q.choices[myChoice] : "未回答";
        contentArea.innerHTML = `
          <div class="q-text">${q.text}</div>
          <div class="status-box">
            <p style="margin:0 0 8px;">あなたの回答</p>
            <strong style="font-size:2rem; color:#1e3a5f;"></strong>
          </div>
          <p class="sub" style="margin-top:16px;">スクリーンで正解発表をお待ちください！</p>
        `;
        contentArea.querySelector("strong").textContent = chosenText;
        return;
      }

      if (phase === "answer") {
        const myChoice = myAnswers[questionIndex];
        const isCorrect = myChoice === q.answer;
        contentArea.innerHTML = `
          <div class="q-text">${q.text}</div>
          <div class="status-box ${isCorrect ? "correct" : "wrong"}">
            ${isCorrect ? "⭕ 正解！" : "❌ ざんねん…"}
          </div>
          <p style="margin-top:20px; font-size:1.3rem; font-weight:bold;">正解：<span id="ansText"></span></p>
        `;
        contentArea.querySelector("#ansText").textContent = q.choices[q.answer];
        return;
      }

      if (phase === "ranking") {
        const [usersSnap, ansSnap] = await Promise.all([get(ref(db, "users")), get(ref(db, "answers"))]);
        const users = usersSnap.val() || {};
        const answers = ansSnap.val() || {};
        const scores = Object.entries(users).map(([uid, u]) => {
          let score = 0;
          QUESTIONS.forEach((item, idx) => {
            if (answers[idx] && answers[idx][uid] === item.answer) score++;
          });
          return { uid, score };
        }).sort((a, b) => b.score - a.score);

        let rank = 1;
        let myRank = "-", myScore = 0;
        scores.forEach((s, i) => {
          if (i > 0 && s.score < scores[i - 1].score) rank = i + 1;
          if (s.uid === userId) { myRank = rank; myScore = s.score; }
        });

        contentArea.innerHTML = `
          <h1>結果発表！</h1>
          <div class="status-box">
            <p style="margin:0;">あなたの成績</p>
            <div style="font-size:2rem; font-weight:bold; color:#1e3a5f; margin:8px 0;">
              ${myRank}位 <span style="font-size:1.1rem;">（${myScore} / ${QUESTIONS.length}問正解）</span>
            </div>
          </div>
          <p class="sub" style="margin-top:16px;">スクリーンをご覧ください！</p>
        `;
      }
    }
  </script>

          <h1>結果発表！</h1>
          <div class="status-box">
            <p style="margin:0;">あなたの成績</p>
            <div style="font-size:2rem; font-weight:bold; color:#1e3a5f; margin:8px 0;">
              ${myRank}位 <span style="font-size:1.1rem;">（${myScore} / ${QUESTIONS.length}問正解）</span>
            </div>
          </div>
          <p class="sub" style="margin-top:16px;">スクリーンをご覧ください！</p>
        `;
      }
    }
  </script>
</body>
</html>
